# Builds Pivot and publishes it to GitHub Pages (Settings > Pages > Source: GitHub Actions).
# A code change on main rebuilds from last/ without fetching; the three scheduled runs mirror the claude.ai refreshes
# (times are UTC, so they land an hour later in US Eastern daylight time) and commit the new last/ back to main.
name: Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "47 11 * * *"   # 6:47am ET: every source and the prediction scorecard
    - cron: "11 22 * * *"   # 5:11pm ET: injuries and news before tip-off
    - cron: "23 6 * * *"    # 1:23am ET: after the last game
  workflow_dispatch:
    inputs:
      mode:
        description: "build (no fetching), daily, injuries or night"
        default: night
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright, Chromium and the parsers
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
          python3 -m pip install -q beautifulsoup4 lxml
      - name: Pick the run
        id: mode
        run: |
          case "${{ github.event_name }}/${{ github.event.schedule }}" in
            push/*) m=build ;;
            "schedule/47 11 * * *") m=daily ;;
            "schedule/11 22 * * *") m=injuries ;;
            schedule/*) m=night ;;
            *) m="${{ github.event.inputs.mode }}" ;;
          esac
          echo "mode=$m" >> "$GITHUB_OUTPUT"
      - name: Refresh and build
        run: bash refresh.sh ${{ steps.mode.outputs.mode }}
      - name: Save the new data to last/
        if: steps.mode.outputs.mode != 'build'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last
          git diff --cached --quiet && exit 0
          git commit -q -m "Data refresh (${{ steps.mode.outputs.mode }})"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          echo "::warning::couldn't push last/; the page still deploys"
      - name: Stage the site
        run: mkdir -p _site && cp build/index.html brand/favicon-32.png brand/favicon-192.png brand/apple-touch-icon.png _site/ && touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
